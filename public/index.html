<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS651 Lab N3.2</title>

    <style>
        :root {
            color-scheme: light;
            --ink: #203040;
            --muted: #617080;
            --accent: #176b87;
            --accent-dark: #10546b;
            --surface: #ffffff;
            --background: #eef4f5;
            --border: #d5e0e3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            background: var(--background);
            max-width: 700px;
            margin: 0 auto;
            padding: 48px 20px;
        }

        header {
            margin-bottom: 28px;
        }

        .eyebrow {
            color: var(--accent);
            font-family: Arial, sans-serif;
            font-size: 0.78rem;
            font-weight: bold;
            letter-spacing: 0.08em;
            margin: 0 0 8px;
            text-transform: uppercase;
        }

        h1,
        h2 {
            margin-top: 0;
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 8px;
        }

        .intro {
            color: var(--muted);
            font-family: Arial, sans-serif;
            line-height: 1.5;
            margin: 0;
        }

        section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 8px 22px rgba(32, 48, 64, 0.06);
            padding: 24px;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 1.35rem;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
            font-weight: bold;
            margin: 14px 0 6px;
        }

        input {
            display: block;
            border: 1px solid #b8c9ce;
            border-radius: 5px;
            font: 1rem Arial, sans-serif;
            padding: 11px 12px;
            width: 100%;
        }

        input:focus {
            border-color: var(--accent);
            outline: 2px solid rgba(23, 107, 135, 0.18);
        }

        button {
            background: var(--accent);
            border: 0;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font: bold 0.9rem Arial, sans-serif;
            margin-top: 12px;
            padding: 11px 18px;
        }

        button:hover {
            background: var(--accent-dark);
        }

        #result {
            background: #f1f7f8;
            border-left: 4px solid var(--accent);
            color: var(--ink);
            font-family: Arial, sans-serif;
            line-height: 1.5;
            margin-top: 20px;
            padding: 12px 15px;
            min-height: 25px;
        }

        @media (max-width: 520px) {
            body {
                padding: 32px 14px;
            }

            h1 {
                font-size: 2rem;
            }

            section {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <p class="eyebrow">CS651 | Lab N3.2</p>
        <h1>Forms and REST API</h1>
        <p class="intro">Compare a traditional HTML form submission with a JSON request sent using <code>fetch()</code>.</p>
    </header>

    <section>
        <h2>Part A - Traditional HTML Form</h2>

        <form action="/readCustomerInfoAndRespond" method="POST">
            <label for="traditional-name">Name</label>
            <input type="text" id="traditional-name" name="name" required>

            <label for="traditional-email">Email</label>
            <input type="email" id="traditional-email" name="email" required>

            <button type="submit">Traditional Submit</button>
        </form>
    </section>

    <section>
        <h2>Part B - REST API with fetch()</h2>

        <form id="restForm">
            <label for="name">Name</label>
            <input type="text" id="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <button id="submitBtn" type="submit">REST Submit</button>
        </form>

        <div id="result" aria-live="polite"></div>
    </section>

    <script>
        document.getElementById("restForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const result = document.getElementById("result");

            try {
                const response = await fetch("/api/customer", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: document.getElementById("name").value,
                        email: document.getElementById("email").value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "The request could not be completed.");
                }

                result.textContent = `${data.message} We will contact you at ${data.email}`;
            } catch (error) {
                result.textContent = `Unable to submit the form: ${error.message}`;
            }
        });
    </script>

</body>

</html>
