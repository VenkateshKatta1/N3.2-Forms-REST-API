<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS651 Lab N3.2</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        section {
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
        }

        input {
            display: block;
            width: 95%;
            padding: 8px;
            margin: 10px 0;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f3f3f3;
            min-height: 25px;
        }
    </style>
</head>

<body>

    <h1>CS651 Lab N3.2</h1>

    <section>
        <h2>Part A - Traditional HTML Form</h2>

        <form action="/readCustomerInfoAndRespond" method="POST">
            <label>Name:</label>
            <input type="text" name="name" required>

            <label>Email:</label>
            <input type="email" name="email" required>

            <button type="submit">Traditional Submit</button>
        </form>
    </section>

    <section>
        <h2>Part B - REST API with fetch()</h2>

        <label>Name:</label>
        <input type="text" id="name">

        <label>Email:</label>
        <input type="email" id="email">

        <button id="submitBtn">REST Submit</button>

        <div id="result"></div>
    </section>

    <script>
        document.getElementById("submitBtn").addEventListener("click", async () => {
            const response = await fetch("/api/customer", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: document.getElementById("name").value,
                    email: document.getElementById("email").value
                })
            });

            const data = await response.json();

            document.getElementById("result").innerHTML =
                data.message + "<br>We will contact you at " + data.email;
        });
    </script>

</body>

</html>
